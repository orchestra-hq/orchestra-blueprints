version: 1
default_environment: dev
project_id: orchestra-blueprints-lightdash-bigquery
environments:
  - name: dev
plugins:
  extractors:
    - name: tap-lightdash
      variant: gthesheep
      pip_url: git+https://github.com/gthesheep/tap-lightdash.git
      config:
        url: $TAP_LIGHTDASH_URL
        personal_access_token: $TAP_LIGHTDASH_PERSONAL_ACCESS_TOKEN
      select:
        - "*.*"
  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git "setuptools<82"
      config:
        project: $BIGQUERY_PROJECT
        dataset: $BIGQUERY_DATASET
        location: $BIGQUERY_LOCATION
        method: batch_job
