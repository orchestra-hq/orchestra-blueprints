version: v1
name: Databricks asset collection
pipeline:
  19c9549d-c5f1-417b-ba74-8f99c56bf04e:
    tasks:
      e019b6be-c589-46e5-8872-8ef517ca6fb3:
        integration: PYTHON
        integration_job: PYTHON_EXECUTE_SCRIPT
        parameters:
          package_manager: PIP
          python_version: '3.12'
          build_command: pip install -r requirements.txt
          environment_variables: >-
            {"DATABRICKS_WAREHOUSE_ID":"<your_sql_warehouse_id>"}
          set_outputs: false
          source: GIT
          command: python collect_assets.py
          branch: main
          project_dir: python/data_assets/databricks
        depends_on: []
        name: run asset collection
    depends_on: []
    name: group
schedule:
  - name: Weekly at 6am
    cron: 0 6 ? * 2 *
    timezone: Europe/London
webhook:
  enabled: false
meta:
  notes: >-
    Make sure the Databricks connection you are using is a linked connection on
    the python connection, and set DATABRICKS_WAREHOUSE_ID to your SQL warehouse
