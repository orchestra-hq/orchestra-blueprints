version: v1
name: Snowflake asset collection
pipeline:
  collect:
    tasks:
      collect_snowflake_assets:
        integration: PYTHON
        integration_job: PYTHON_EXECUTE_SCRIPT
        parameters:
          package_manager: PIP
          python_version: '3.12'
          build_command: pip install -r requirements.txt
          set_outputs: false
          source: GIT
          command: python collect_snowflake_assets.py
          project_dir: python/data_assets/snowflake
        depends_on: []
        name: run asset collection
    depends_on: []
    name: group
schedule:
  - name: Daily at 8am
    cron: 0 8 ? * * *
    timezone: UTC
webhook:
  enabled: false
meta:
  notes: >-
    Make sure the Snowflake connection you are using is a linked connection on
    the python connection
