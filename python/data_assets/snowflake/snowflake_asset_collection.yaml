version: v1
name: Snowflake asset collection
pipeline:
  19c9549d-c5f1-417b-ba74-8f99c56bf04e:
    tasks:
      e019b6be-c589-46e5-8872-8ef517ca6fb3:
        integration: PYTHON
        integration_job: PYTHON_EXECUTE_SCRIPT
        parameters:
          package_manager: PIP
          python_version: '3.12'
          build_command: pip install -r requirements.txt
          set_outputs: false
          source: GIT
          command: python collect_snowflake_assets.py
          project_dir: python/data_assets/snowflake
        depends_on: []
        name: run asset collection
    depends_on: []
    name: group
schedule:
  - name: Daily at 8am
    cron: 0 8 ? * * *
    timezone: Europe/London
webhook:
  enabled: false
meta:
  notes: >-
    Make sure the Snowflake connection you are using is a linked connection on
    the python connection
