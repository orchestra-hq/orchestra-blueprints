version: v1
name: BigQuery asset collection
pipeline:
  collect:
    tasks:
      collect_bigquery_assets:
        integration: PYTHON
        integration_job: PYTHON_EXECUTE_SCRIPT
        parameters:
          package_manager: PIP
          python_version: '3.12'
          build_command: pip install -r requirements.txt
          set_outputs: false
          source: GIT
          command: python collect_bigquery_assets.py
          project_dir: python/data_assets/bigquery
        depends_on: []
        name: run asset collection
    depends_on: []
    name: group
schedule:
  - name: Weekly at 6.30am
    cron: 30 6 ? * 2 *
    timezone: UTC
webhook:
  enabled: false
meta:
  notes: >-
    Make sure the BigQuery connection you are using is a linked connection on
    the python connection
