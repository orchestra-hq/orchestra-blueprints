name: "fabric_sao_demo"
version: "1.0.0"
config-version: 2

# Must match the profile name on the Orchestra dbt Core connection for
# Fabric, not the project name.
profile: "dbt_fabric"

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  fabric_sao_demo:
    staging:
      +materialized: view
      +schema: dbt_sao_demo
    marts:
      +materialized: table
      +schema: dbt_sao_demo
