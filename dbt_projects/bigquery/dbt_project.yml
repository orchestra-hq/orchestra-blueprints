name: "bigquery_sao_demo"
version: "1.0.0"
config-version: 2

# Must match the profile name on the Orchestra dbt Core connection
# (dbt_core__bigquery__01406), not the project name.
profile: "dbt_bigquery"

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  bigquery_sao_demo:
    staging:
      +materialized: view
      +schema: dbt_sao_demo
    marts:
      +materialized: table
      +schema: dbt_sao_demo
    # Incident-monitor test chain. One dataset per lane (var incident_lane) so
    # each lane has its own assets, lineage and monitor.
    incident_chain:
      +materialized: table
      +on_error: continue
      +schema: "incident_chain_{{ var('incident_lane', 'docs') }}"
flags:
  require_generic_test_arguments_property: true
