version: 2

sources:
  - name: raw
    description: >
      Standing tables in the sandbox dataset. `raw_orders` was originally loaded
      by a dbt seed; the project now reads it as a source rather than owning it.
    schema: dbt_sao_demo
    # Static demo data, so an explicit loaded_at_field is the only way state-aware
    # orchestration can judge freshness -- BigQuery has no implicit fallback.
    loaded_at_field: "cast(order_date as timestamp)"
    freshness:
      warn_after: {count: 365, period: day}
    tables:
      - name: raw_orders
        description: "One row per order: id, customer, date, status, amount."
