version: 2

models:
  - name: dbt_test_model_10am
    description: "Clone of dbt_test_model, state-aware and gated to build on the first run after 10am each day"
    config:
      freshness:
        build_after:
          count: >
            {% set now = modules.datetime.datetime.now() %}
            {% set cutoff_hour = 10 %}
            {{ (now.hour - cutoff_hour) % 24 }}
          period: hour
          updates_on: any
    columns:
      - name: id
        data_type: numeric
      - name: name
        data_type: string
