name: 'snowplow_snowflake_sao'
version: '1.0.0'
config-version: 2

# Must match the profile name on the Orchestra dbt Core connection for this
# project. The connection holds the profiles.yml contents; the profile it
# defines has to be called 'snowflake_airflow_dbt'.
profile: 'snowflake_airflow_dbt'

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# snowplow_utils shadows a handful of dbt built-in macros. dbt only honours
# `dispatch` from the root project, so the package's own copy of this block is
# not enough — it has to be repeated here or the package fails to compile.
dispatch:
  - macro_namespace: dbt
    search_order: ['snowplow_utils', 'dbt']

vars:
  # These are deliberately GLOBAL (not nested under `snowplow_normalize:`).
  # Package-scoped vars are only visible to models inside that package, and the
  # generated event models live in THIS project — scoping them to the package
  # makes every generated model fail with
  # "Required var 'snowplow__partition_tstamp' not found in config".
  # Global vars are visible to the package and to this project alike.

  # Asserts acceptance of the Snowplow Personal and Academic License v1.0
  # (or an existing commercial agreement). Checked at run start by
  # snowplow_utils.license_check(); false by default, and the run aborts
  # with a compiler error until it is set true.
  # https://docs.snowplow.io/personal-and-academic-license-1.0
  snowplow__license_accepted: true

  # Points the package's `atomic.events` source at
  # SNOWPLOW_TRACKING.ATOMIC.EVENTS. Without snowplow__database the source
  # falls back to target.database.
  snowplow__database: SNOWPLOW_TRACKING
  snowplow__atomic_schema: ATOMIC

  # Required by the generated models with no default of their own.
  snowplow__partition_tstamp: collector_tstamp
  snowplow__session_timestamp: collector_tstamp

  # The package walks forward from start_date (or, once the manifest has
  # entries, from the last processed timestamp) in backfill_limit_days chunks.
  # The first run modelled 2020-01-01 to 2020-01-31 and found nothing, because
  # the events are far more recent — at 30 days a run it would take ~80 runs to
  # reach them. 3000 days lets a single run catch up from where the manifest
  # currently sits all the way past today.
  # Drop this back to 30 once caught up; leaving it high makes each run scan a
  # needlessly wide window.
  snowplow__start_date: '2020-01-01'
  snowplow__backfill_limit_days: 3000

  # Empty list = model every app_id present in the events table.
  snowplow__app_id: []

  # -1 disables the late-arriving-data filter. That filter is the only thing
  # in the package's base models referencing dvce_sent_tstamp /
  # dvce_created_tstamp, neither of which exists in
  # SNOWPLOW_TRACKING.ATOMIC.EVENTS — with the default of 3 the run fails on
  # an invalid identifier. Set this back to 3 if those columns are ever added.
  snowplow__days_late_allowed: -1

flags:
  # The package's schema YAML uses the `arguments:` property for generic tests,
  # which dbt 1.10+ only parses with this flag on.
  require_generic_test_arguments_property: true
