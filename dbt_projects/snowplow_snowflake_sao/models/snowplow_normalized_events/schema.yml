  - name: snowplow_events_normalized
    description: >
      Lookup mapping every modelled event_id to the normalized table it landed in.
      One row per event per destination table. This is the table the summary
      dashboard is built on.
    columns:
      - name: event_id
        data_type: varchar
        description: Snowplow event UUID.
      - name: collector_tstamp
        data_type: timestamp_ntz
        description: Time the collector received the event.
      - name: event_name
        data_type: varchar
        description: Snowplow event name.
      - name: event_table_name
        data_type: varchar
        description: Normalized table this event was written to.
      - name: unique_id
        data_type: varchar
        description: event_id concatenated with event_table_name.
    data_tests:
      # Fails if no event has been modelled in the last 3 days. severity: warn
      # on purpose — an error would fail `dbt build`, and the Lightdash refresh
      # task is gated on that task succeeding, so a stale warehouse would also
      # stop the dashboard from refreshing.
      - dbt_utils.recency:
          arguments:
            datepart: day
            field: collector_tstamp
            interval: 3
          config:
            severity: warn
    config:
      meta:
        metrics:
          total_events:
            label: Total events
            type: count_distinct
            sql: event_id
            description: Distinct Snowplow events modelled.
          latest_event_at:
            label: Latest event
            type: max
            sql: collector_tstamp
            description: Collector timestamp of the most recent modelled event.

