version: 2

sources:
  - name: raw
    description: >
      Standing tables in the sandbox dataset, shared with the `bigquery`
      blueprint. Read here, owned by neither project.
    schema: dbt_sao_demo
    config:
      # dbt 2.x only accepts these under `config:`; at source level they raise
      # UnusedConfigKey (dbt1060) and the build fails.
      loaded_at_field: "cast(order_date as timestamp)"
      freshness:
        warn_after: {count: 365, period: day}
    tables:
      - name: raw_orders
        description: "One row per order: id, customer, date, status, amount."

  - name: crm
    description: >
      A second source with no models downstream of it, so a selection like
      `source:raw.raw_orders+` leaves it out of scope.
    schema: dbt_sao_demo
    config:
      loaded_at_field: "cast(updated_at as timestamp)"
      freshness:
        warn_after: {count: 365, period: day}
    tables:
      - name: raw_customers
        description: "One row per customer: id, name, signup date, updated_at."
