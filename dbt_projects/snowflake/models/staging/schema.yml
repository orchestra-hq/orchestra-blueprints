
version: 2

models:
  - name: snowflake_orders_staging
    description: "A staging model for orders"
    columns:
      - name: _pk
        description: "The primary key for this table"
        tests:
          - not_null
          - unique
  - name: product_usage_staging
    config:
      tags:
        - massive_dag 
    description: "A staging model for orders"
    columns:
      - name: vid
        description: "The primary key for this table"
        tests:
          - not_null
          - unique
  - name: product_objects_staging
    config:
      tags:
        - massive_dag 
        - test_1
        - test_2
    description: "A staging model for orders"
    columns:
      - name: vid
        description: "The primary key for this table"
        tests:
          - not_null
          - unique
  - name: marketing_data_staging
    config:
      tags:
        - massive_dag 
        - test_1
    description: "A staging model for orders"
    columns:
      - name: vid
        description: "The primary key for this table"
        tests:
          - not_null
          - unique
  - name: oil_area_staging
    config:
      tags:
        - oil_chain
    description: "Staging view of oil readings for area-level reporting. Same rows as oil_data_clean."
    tests:
      - row_count_matches:
          arguments:
            compare_model: ref('oil_data_clean')
    columns:
      - name: _pk
        description: "Surrogate key: SHA-256 of the reading timestamp + site_name. One per site reading."
        tests:
          - unique
          - not_null
      - name: site_name
        description: "Name of the producing site or operator."
        tests:
          - not_null
      - name: owner
        description: "Person responsible for the reading in the sheet."
      - name: timestamp
        description: "When the reading was taken (text in the clean and staging layers, cast to TIMESTAMP in oil_data_aggregated)."
        tests:
          - not_null
      - name: measurement
        description: "Production measurement for the site at that time."
        tests:
          - not_null
          - non_negative
  - name: oil_production_staging
    config:
      tags:
        - oil_chain
    description: "Staging view of oil production readings for production reporting. Same rows as oil_data_clean."
    tests:
      - row_count_matches:
          arguments:
            compare_model: ref('oil_data_clean')
    columns:
      - name: _pk
        description: "Surrogate key: SHA-256 of the reading timestamp + site_name. One per site reading."
        tests:
          - unique
          - not_null
      - name: site_name
        description: "Name of the producing site or operator."
        tests:
          - not_null
      - name: owner
        description: "Person responsible for the reading in the sheet."
      - name: timestamp
        description: "When the reading was taken (text in the clean and staging layers, cast to TIMESTAMP in oil_data_aggregated)."
        tests:
          - not_null
      - name: measurement
        description: "Production measurement for the site at that time."
        tests:
          - not_null
          - non_negative

