version: 2

models:
  - name: hubspot_contacts_clean
    config:
      tags:
        - massive_dag
    description: "A starter dbt model"
    columns:
      - name: vid
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
      - name: canonical_vid
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
  - name: seed_clean
    config:
      tags:
        - massive_dag
    description: "A starter dbt model"
    columns:
      - name: a
        description: "The primary key for this table"
        tests:
          - not_null
  - name: store_sales_example
    config:
      tags:
        - massive_dag
    description: "Example store sales"
    tests:
      - average:
          arguments:
            threshold: 2000
            average_field: sales
            date_field: date
            null_filter: store
          config:
            severity: warn
            warn_if: ">= 1"
  - name: oil_data_clean
    config:
      tags:
        - massive_dag
        - oil_chain
    description: >-
      Clean oil production readings from the Fivetran Google Sheets sync,
      with a surrogate key `_pk` added. One row per site reading.
    tests:
      - row_count_matches:
          arguments:
            compare_model: source('fivetran', 'oil_data')
    columns:
      - name: _pk
        description: "Surrogate key: SHA-256 of the reading timestamp + site_name. One per site reading."
        tests:
          - unique
          - not_null
      - name: site_name
        description: "Name of the producing site or operator."
        tests:
          - not_null
      - name: owner
        description: "Person responsible for the reading in the sheet."
      - name: timestamp
        description: "When the reading was taken (text in the clean and staging layers, cast to TIMESTAMP in oil_data_aggregated)."
        tests:
          - not_null
      - name: measurement
        description: "Production measurement for the site at that time."
        tests:
          - not_null
          - non_negative
      - name: _row
        description: "Fivetran row number in the source sheet."
      - name: _fivetran_synced
        description: "When Fivetran last synced the row."
        tests:
          - not_null
      - name: _test_column
        description: "Constant demo column ('test_column')."
      - name: broken_column
        description: "Constant demo column ('additional_column')."
      - name: _third_column
        description: "Constant demo column ('third column')."
      - name: _fourth_column
        description: "Constant demo column ('fourth column'). Read by oil_data_aggregated."
