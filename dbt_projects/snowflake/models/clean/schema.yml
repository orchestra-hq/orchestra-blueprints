version: 2

models:
  - name: hubspot_contacts_clean
    config:
      meta:
        owner: "moo@baa.com"
        channel: "#test-data-alerts"
        subscribers: ["moo1@baa.com", "moo2@baa.com"]
        tags: ["moo1", "moo2"]
    description: "A starter dbt model"
    columns:
      - name: vid
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
      - name: canonical_vid
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values:
                - "__THIS_VALUE_SHOULD_NEVER_MATCH__"
  - name: seed_clean
    config:
      tags:
        - massive_dag
    description: "A starter dbt model"
    columns:
      - name: a
        description: "The primary key for this table"
        data_tests:
          - not_null
  - name: store_sales_example
    config:
      tags:
        - massive_dag
    description: "Example store sales"
    data_tests:
      - average:
          threshold: 2000
          average_field: sales
          date_field: date
          null_filter: store
          config:
            severity: warn
            warn_if: ">= 1"
  - name: oil_data_clean
    config:
      tags:
        - massive_dag
    description: "Example store sales"
    columns:
      - name: _pk
        description: "The primary key for this table"
        data_tests:
          - not_null:
              config:
                severity: warn
                warn_if: ">= 1"
          - unique
