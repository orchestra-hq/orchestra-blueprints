name: "databricks_sao_demo"
version: "1.0.0"
config-version: 2

# Must match the profile name on the Orchestra dbt Core connection for
# Databricks (dbt_databricks_demo_54814), which the shared
# dbt_projects/databricks also uses.
profile: "orchestra_dbt_databricks"

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Elementary's on-run-start hook runs during `dbt build`, matching the real
# project's setup. source_freshness_run_project_hooks makes it (and this
# project's own hook, if one is added) also run during `dbt source freshness`
# -- the invocation ORCHESTRA_SCOPE_SOURCE_FRESHNESS_TO_SELECTION triggers --
# which is one candidate for what's behind the real project's "Collected 0
# source(s)" run: a hook failure there is invisible to us (quiet invocation,
# no result surfaced), unlike a hook failure during the build itself.
flags:
  require_explicit_package_overrides_for_builtin_materializations: false
  source_freshness_run_project_hooks: true

on-run-start:
  - "{{ elementary.on_run_start() }}"

models:
  databricks_sao_demo:
    # The connection's profile points at the lakehouse the shared project uses;
    # +database redirects this project to a Unity Catalog catalog instead, which
    # is what makes a delimited relation name possible at all.
    +database: main
    staging:
      +materialized: view
      +schema: dbt_sao_demo
    marts:
      +materialized: table
      +schema: dbt_sao_demo
  elementary:
    +schema: "elementary"
