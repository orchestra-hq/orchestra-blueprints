name: "databricks_sao_demo"
version: "1.0.0"
config-version: 2

# Must match the profile name on the Orchestra dbt Core connection for
# Databricks (dbt_databricks_demo_54814), which the shared
# dbt_projects/databricks also uses.
profile: "orchestra_dbt_databricks"

model-paths: ["models"]
macro-paths: ["macros"]

on-run-start:
  - "{{ demo_hook() }}"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  databricks_sao_demo:
    # The connection's profile points at the lakehouse the shared project uses;
    # +database redirects this project to a Unity Catalog catalog instead, which
    # is what makes a delimited relation name possible at all.
    +database: main
    staging:
      +materialized: view
      +schema: dbt_sao_demo
    marts:
      +materialized: table
      +schema: dbt_sao_demo
    orchestra_demo:
      +tags: orchestra_demo
      # demo_lane isolates parallel experiments: own tables, assets and SAO state.
      +schema: "{{ 'orchestra_demo' ~ (('_' ~ var('demo_lane')) if var('demo_lane', '') else '') }}"
      +materialized: table
      +database: "{{ var('demo_catalog', 'main') }}"
    # Scenarios 13/14: a 5-model chain A->B->C->D->E, own tag so the other
    # scenarios' tag:orchestra_demo selections are unchanged.
    orchestra_demo_chain:
      +tags: orchestra_demo_chain
      +schema: "{{ 'orchestra_demo' ~ (('_' ~ var('demo_lane')) if var('demo_lane', '') else '') }}"
      +materialized: table
      +database: "{{ var('demo_catalog', 'main') }}"
  # Scenario 14: D/E from the local package demo_packages/demo_chain_pkg.
  demo_chain_pkg:
    +tags: orchestra_demo_chain
    +schema: "{{ 'orchestra_demo' ~ (('_' ~ var('demo_lane')) if var('demo_lane', '') else '') }}"
    +materialized: table
    +database: "{{ var('demo_catalog', 'main') }}"
