version: 2

models:
  - name: stg_orders
    description: "Typed view over the raw.raw_orders source."
    columns:
      - name: order_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: order_date
        tests:
          - not_null

  - name: stg_system_audit_check
    description: >
      Exists only to reference `system_uc.audit` (Databricks' built-in Unity
      Catalog system catalog) so it stays in scope for source-freshness
      collection.

  - name: stg_samples_check
    description: >
      Exists only to reference `samples_uc.trips` (Databricks' built-in
      `samples` catalog, delivered via Delta Sharing) so it stays in scope for
      source-freshness collection.
