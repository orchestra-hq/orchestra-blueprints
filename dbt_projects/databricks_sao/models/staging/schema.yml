version: 2

models:
  - name: stg_orders
    description: "Typed view over the raw.raw_orders source."
    columns:
      - name: order_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: order_date
        tests:
          - not_null

  - name: stg_audit_check
    description: >
      Exists only to reference `audit.raw_audit_log` so it stays in scope for
      source-freshness collection. Expected to fail to build (the source
      table doesn't exist) -- that failure is orthogonal to what this model
      tests.

  - name: stg_system_audit_check
    description: >
      Exists only to reference `system_uc.audit` (Databricks' built-in Unity
      Catalog system catalog) so it stays in scope for source-freshness
      collection.
