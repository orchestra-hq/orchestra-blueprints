version: 2

sources:
  - name: raw
    description: >
      Standing tables in the sandbox schema. `raw_orders` is read but not owned
      by this project -- the pipeline's `seed raw_orders` step creates it.
    database: main
    schema: dbt_sao_demo
    # Static demo data, so an explicit loaded_at_field is the only way state-aware
    # orchestration can judge freshness.
    loaded_at_field: "cast(order_date as timestamp)"
    freshness:
      warn_after: {count: 365, period: day}
    tables:
      - name: raw_orders
        description: "One row per order: id, customer, date, status, amount."

  - name: raw_unused
    description: >
      A second, unrelated source with no explicit loaded_at_field/loaded_at_query
      -- on Databricks this is exactly the shape that falls back to `DESCRIBE
      HISTORY`. Nothing in this pipeline's `--select` touches it; it exists so
      scope_source_freshness_to_selection has something observable to skip.
    database: main
    schema: dbt_sao_demo
    tables:
      - name: raw_events
        description: "Unused by the demo's selection on purpose."
