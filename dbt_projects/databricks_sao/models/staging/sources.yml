version: 2

sources:
  - name: raw
    description: >
      Standing tables in the sandbox schema. `raw_orders` is read but not owned
      by this project -- the pipeline's `seed raw_orders` step creates it.
      `loaded_at_field` is set but there is no `freshness` block, to test
      whether SAO still collects/uses freshness for a real, existing table
      when nothing defines what counts as stale.
    database: main
    schema: dbt_sao_demo
    loaded_at_field: "cast(order_date as timestamp)"
    tables:
      - name: raw_orders
        description: "One row per order: id, customer, date, status, amount."

  - name: crm
    description: >
      A second source with no models downstream of it, so that a selection like
      `source:raw.raw_orders+` leaves it entirely out of scope. That is what
      makes source-freshness scoping observable: unscoped, a run collects
      freshness for both sources; scoped, only for `raw`. Like `raw`, it is read
      but not owned by this project.
    database: main
    schema: dbt_sao_demo
    loaded_at_field: "cast(updated_at as timestamp)"
    freshness:
      warn_after: {count: 365, period: day}
    tables:
      - name: raw_customers
        description: "One row per customer: id, name, signup date, updated_at."

  - name: audit
    description: >
      A third source: `loaded_at_field` is set but there is no `freshness`
      block, and the table itself is never seeded, so it does not exist in the
      warehouse. Exercises how SAO's source-freshness collection handles a
      source dbt considers freshness-eligible (`loaded_at_field` present) but
      that has nothing to check freshness against, and one that would error if
      actually queried.
    database: main
    schema: dbt_sao_demo
    loaded_at_field: "cast(logged_at as timestamp)"
    tables:
      - name: raw_audit_log
        description: "Not seeded by any pipeline step -- intentionally absent from the warehouse."
