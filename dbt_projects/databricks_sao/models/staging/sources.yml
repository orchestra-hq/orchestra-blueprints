version: 2

sources:
  - name: raw
    description: >
      Standing tables in the sandbox schema. `raw_orders` is read but not owned
      by this project -- the pipeline's `seed raw_orders` step creates it.
      Uses `loaded_at_query` (not `loaded_at_field`) and no `freshness` block,
      to test whether SAO still collects/uses freshness -- computed via a real
      custom query, not just a column reference -- for a real, existing table
      when nothing defines what counts as stale.
    database: main
    schema: dbt_sao_demo
    tables:
      - name: raw_orders
        description: "One row per order: id, customer, date, status, amount."
        config:
          loaded_at_query: >-
            select max(cast(order_date as timestamp)) as order_date
            from {{ this }}

  - name: crm
    description: >
      A second source with no models downstream of it, so that a selection like
      `source:raw.raw_orders+` -- or a bare `dbt build` with no --select at all,
      which resolves to every model in the project -- still leaves it entirely
      out of scope, because nothing depends on it. That is what makes
      source-freshness scoping observable: unscoped, a run collects freshness
      for it; scoped, it doesn't. No `freshness` block, same as `raw`, so the
      only thing that varies between the two sources is whether a model
      actually uses them. Like `raw`, it is read but not owned by this project.
    database: main
    schema: dbt_sao_demo
    loaded_at_field: "cast(updated_at as timestamp)"
    tables:
      - name: raw_customers
        description: "One row per customer: id, name, signup date, updated_at."

  - name: system_uc
    description: >
      Databricks' built-in Unity Catalog `system` catalog -- present (if UC is
      enabled) in every workspace, but read access is governed separately from
      normal managed tables and is often not granted to the service principal
      running dbt. `loaded_at_field` is set but there is no `freshness` block,
      matching the shape of the real project this is modelling (16 of 768
      sources live in `system`, alongside 374 in a Delta Share catalog -- this
      is the closest analog buildable without a real share). Referenced by
      `stg_system_audit_check` so it stays in scope for source-freshness
      collection. If a permission/listing failure on this one source is
      capable of silently zeroing out the *entire* collection (the "Collected
      0 source(s)" bug), it should show up here.
    database: system
    schema: access
    loaded_at_field: "event_time"
    tables:
      - name: audit
        description: "Unity Catalog audit log -- one row per auditable event."

  - name: samples_uc
    description: >
      Databricks' built-in `samples` catalog -- present by default in
      Unity-Catalog-enabled workspaces, delivered as a genuine read-only Delta
      Share (unlike `system_uc`, which is a foreign/system catalog but not
      actually Delta Sharing). This is the closest available analog to the 374
      of 768 real sources living in `oenz_data_prod_kraken_source_share`: same
      config shape (`loaded_at_field` set, no `freshness` block) as most of the
      real project's sources, but backed by an actual share rather than a
      managed table. Referenced by `stg_samples_check` so it stays in scope.
      If Delta Sharing specifically (not just an inaccessible/foreign catalog
      in general, which `system_uc` already rules out) is what silently zeroes
      out the whole collection, this is the source that would show it.
    database: samples
    schema: nyctaxi
    loaded_at_field: "tpep_pickup_datetime"
    tables:
      - name: trips
        description: "NYC taxi trips sample dataset, shared via Delta Sharing."
