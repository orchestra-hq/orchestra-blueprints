version: 2

sources:
  - name: raw
    description: >
      Standing tables in the sandbox schema. `raw_orders` is read but not owned
      by this project -- the pipeline's `seed raw_orders` step creates it.
      `loaded_at_field` is set but there is no `freshness` block, to test
      whether SAO still collects/uses freshness for a real, existing table
      when nothing defines what counts as stale.
    database: main
    schema: dbt_sao_demo
    loaded_at_field: "cast(order_date as timestamp)"
    tables:
      - name: raw_orders
        description: "One row per order: id, customer, date, status, amount."

  - name: crm
    description: >
      A second source with no models downstream of it, so that a selection like
      `source:raw.raw_orders+` leaves it entirely out of scope. That is what
      makes source-freshness scoping observable: unscoped, a run collects
      freshness for both sources; scoped, only for `raw`. Like `raw`, it is read
      but not owned by this project.
    database: main
    schema: dbt_sao_demo
    loaded_at_field: "cast(updated_at as timestamp)"
    freshness:
      warn_after: {count: 365, period: day}
    tables:
      - name: raw_customers
        description: "One row per customer: id, name, signup date, updated_at."

  - name: audit
    description: >
      A third source: `loaded_at_field` is set but there is no `freshness`
      block, and the table itself is never seeded, so it does not exist in the
      warehouse. Exercises how SAO's source-freshness collection handles a
      source dbt considers freshness-eligible (`loaded_at_field` present) but
      that has nothing to check freshness against, and one that would error if
      actually queried. Referenced by `stg_audit_check` so it stays in scope
      even when `ORCHESTRA_SCOPE_SOURCE_FRESHNESS_TO_SELECTION` is on -- an
      unreferenced source (like `crm`) would just be scoped out, which doesn't
      exercise this path.
    database: main
    schema: dbt_sao_demo
    loaded_at_field: "cast(logged_at as timestamp)"
    tables:
      - name: raw_audit_log
        description: "Not seeded by any pipeline step -- intentionally absent from the warehouse."

  - name: system_uc
    description: >
      Databricks' built-in Unity Catalog `system` catalog -- present (if UC is
      enabled) in every workspace, but read access is governed separately from
      normal managed tables and is often not granted to the service principal
      running dbt. `loaded_at_field` is set but there is no `freshness` block,
      matching the shape of the real project this is modelling (16 of 768
      sources live in `system`, alongside 374 in a Delta Share catalog -- this
      is the closest analog buildable without a real share). Referenced by
      `stg_system_audit_check` so it stays in scope for source-freshness
      collection. If a permission/listing failure on this one source is
      capable of silently zeroing out the *entire* collection (the "Collected
      0 source(s)" bug), it should show up here.
    database: system
    schema: access
    loaded_at_field: "event_time"
    tables:
      - name: audit
        description: "Unity Catalog audit log -- one row per auditable event."
