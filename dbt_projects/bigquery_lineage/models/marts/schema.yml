version: 2

models:
  - name: lineage_assets
    description: >
      Every asset across BigQuery, Lightdash and Fivetran, shaped like the body
      of Orchestra's `POST /assets`. Published by
      `python/lineage/publish_lineage.py`.
    columns:
      - name: external_id
        description: Orchestra's unique asset identifier. Must be unique per workspace.
        tests: [not_null, unique]
      - name: integration
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["GCP_BIG_QUERY", "LIGHTDASH", "FIVETRAN"]
      - name: asset_name
        tests: [not_null]
      - name: integration_account_id
        tests: [not_null]

  - name: lineage_edges
    description: >
      Directed lineage edges, shaped like the body of Orchestra's
      `POST /assets/dependencies`. Both ends are guaranteed to exist in
      `lineage_assets`.
    columns:
      - name: from_external_id
        tests: [not_null]
      - name: to_external_id
        tests: [not_null]
      - name: lineage_detail
        tests: [not_null]
