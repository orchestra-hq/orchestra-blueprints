name: 'snowplow_unified_snowflake'
version: '1.0.0'
config-version: 2

# Must match the profile name on the Orchestra dbt Core connection.
profile: 'snowflake_airflow_dbt'

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# snowplow_utils shadows dbt built-in macros; dbt only honours `dispatch` from
# the root project, so it has to be repeated here.
dispatch:
  - macro_namespace: dbt
    search_order: ['snowplow_utils', 'dbt']

vars:
  # Global (not package-scoped) so snowplow_utils sees them too.
  snowplow__license_accepted: true

  # The package reads events from <target.database>.<snowplow__atomic_schema>.events.
  # That is a view the on-run-start hook builds over snowplow_raw_events,
  # adding the standard atomic columns the raw table lacks (see
  # macros/create_snowplow_events_compat.sql).
  snowplow_raw_events: SNOWPLOW_TRACKING.ATOMIC.EVENTS
  snowplow__atomic_schema: SNOWPLOW_ATOMIC_COMPAT
  # The compat view's dvce_* timestamps are NULL; this makes the package's
  # late-event filter coalesce them to collector_tstamp instead of dropping
  # every row.
  snowplow__allow_null_dvce_tstamps: true
  snowplow__start_date: '2020-01-01'
  # First run backfills everything in one go; drop to 30 after it succeeds.
  snowplow__backfill_limit_days: 3000
  snowplow__enable_web: true
  snowplow__enable_mobile: false
  snowplow__session_timestamp: collector_tstamp

on-run-start:
  - "{{ create_snowplow_events_compat() }}"

flags:
  require_generic_test_arguments_property: true
