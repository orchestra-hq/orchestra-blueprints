version: v1
name: 'Platform lineage graph #dlt #bigquery #lightdash #fivetran #dbt #metaengine #python'
pipeline:
  # --- 1. Extract -------------------------------------------------------------
  # One MetaEngine child per platform. Each runs the same script with a different
  # LINEAGE_SOURCE, so the extracts are sibling task runs in parallel and adding
  # a platform is a one-line change to the `sources` input.
  8f2a1c74-3b6d-4e51-9a02-c7d84f5b1e63:
    tasks:
      1d5e93b8-6c47-4a29-8f13-5b0e7a2d94c1:
        integration: PYTHON
        integration_job: PYTHON_EXECUTE_SCRIPT
        parameters:
          package_manager: PIP
          python_version: '3.12'
          build_command: pip install -r requirements.txt
          source: GIT
          branch: ${{ inputs.branch }}
          command: python -m load_source
          project_dir: python/lineage
          shallow_clone_dirs: python/lineage
          set_outputs: false
          environment_variables: '{
            "LINEAGE_SOURCE": "${{ MATRIX.source }}",
            "LINEAGE_RAW_DATASET": "${{ inputs.raw_dataset }}",
            "BIGQUERY_PROJECT": "${{ inputs.bq_project }}",
            "BIGQUERY_LOCATION": "${{ inputs.bq_location }}",
            "LINEAGE_BQ_LOOKBACK_DAYS": "${{ inputs.bq_lookback_days }}"
            }'
        depends_on: []
        name: dlt extract
        tags:
        - dlt
        - lineage
        connection: blueprints__meltano__51199
        operation_metadata:
          3a7f0e51-8d24-4c96-b1e7-2f5a6c8b30d9:
            integration: GCP_BIG_QUERY
            connection: dbt_bigquery_24777
    depends_on: []
    name: Extract platform metadata
    matrix:
      inputs:
        # Driven by an input so a single source can be run in isolation (handy
        # when a platform's credentials are not provisioned yet) and so adding a
        # platform needs no YAML change here.
        source: ${{ inputs.sources }}

  # --- 2. Transform -----------------------------------------------------------
  # Small dbt Core project that unions the raw metadata into two Orchestra-shaped
  # tables: lineage_assets and lineage_edges.
  b4c69d02-7e35-4f18-a6db-91c30e5847af:
    tasks:
      6e81b7c3-2a49-4d05-bf62-8c17e9a43d20:
        integration: DBT_CORE
        integration_job: DBT_CORE_EXECUTE
        parameters:
          commands: dbt ${{ inputs.dbt_command }}
          package_manager: PIP
          python_version: '3.12'
          branch: ${{ inputs.branch }}
          project_dir: dbt_projects/bigquery_lineage
        depends_on: []
        name: dbt build lineage marts
        tags:
        - dbt
        - lineage
        connection: dbt_core_bigquery_metadata_58622
        operation_metadata:
          d92e4a16-5f83-4b07-8e1c-6a4db2570f38:
            integration: GCP_BIG_QUERY
            connection: dbt_bigquery_24777
    depends_on:
    - 8f2a1c74-3b6d-4e51-9a02-c7d84f5b1e63
    name: Build lineage marts

  # --- 3. Publish -------------------------------------------------------------
  # Push the marts into Orchestra via POST /assets and POST /assets/dependencies.
  # This is the step that makes the graph appear under Data assets > Lineage.
  c07d5138-9b64-4a72-8e51-3f28d6017ba4:
    tasks:
      2b93f60e-4d17-4c85-a239-7e51c8b04df6:
        integration: PYTHON
        integration_job: PYTHON_EXECUTE_SCRIPT
        parameters:
          package_manager: PIP
          python_version: '3.12'
          build_command: pip install -r requirements.txt
          source: GIT
          branch: ${{ inputs.branch }}
          command: python -m publish_lineage
          project_dir: python/lineage
          shallow_clone_dirs: python/lineage
          set_outputs: false
          environment_variables: '{
            "LINEAGE_MART_DATASET": "${{ inputs.mart_dataset }}",
            "BIGQUERY_PROJECT": "${{ inputs.bq_project }}",
            "BIGQUERY_LOCATION": "${{ inputs.bq_location }}"
            }'
        depends_on: []
        name: Publish lineage to Orchestra
        tags:
        - lineage
        connection: blueprints__meltano__51199
    depends_on:
    - b4c69d02-7e35-4f18-a6db-91c30e5847af
    name: Publish lineage

  # --- 4. Serve ---------------------------------------------------------------
  # Refreshing the dashboard closes the loop: the Lightdash charts the graph ends
  # at are rebuilt off the tables the graph starts from.
  e5a28f47-1c93-4b60-8d75-2a94f0c63e18:
    tasks:
      947c1e5b-3f08-4a6d-92b4-5c81de703f2a:
        integration: LIGHTDASH
        integration_job: LIGHTDASH_REFRESH_DASHBOARD
        parameters:
          dashboard_id: ${{ inputs.lightdash_dashboard_id }}
          invalidate_cache: false
        depends_on: []
        name: Refresh Lightdash dashboard
        tags:
        - lightdash
        connection: lightdash__prod__23382
    depends_on:
    - c07d5138-9b64-4a72-8e51-3f28d6017ba4
    name: Refresh BI
schedule:
- name: Daily at 6am
  cron: 0 6 * * ? *
  timezone: Europe/London
webhook:
  enabled: false
inputs:
  branch:
    type: string
    default: main
  sources:
    type: list
    default:
    - lightdash
    - bigquery
    - fivetran
  dbt_command:
    type: string
    default: build
  raw_dataset:
    type: string
    default: platform_lineage_raw
  mart_dataset:
    type: string
    default: platform_lineage
  bq_project:
    type: string
    default: reference-baton-392114
  bq_location:
    type: string
    default: europe-west1
  bq_lookback_days:
    type: string
    default: '7'
  lightdash_dashboard_id:
    type: string
    default: 23e12d2e-6b3c-43e7-9cf6-fab399a421ec
alerts:
- name: Failures
  statuses:
  - FAILED
  destinations:
  - integration: SLACK
    destination: alert-demos
