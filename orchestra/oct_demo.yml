version: v1
name: >-
  dlt + Fivetran Google Sheets -> dbt Snowflake -> Power BI #dlt #fivetran #dbt
  #snowflake #powerbi
pipeline:
  ingest_dlt_python:
    tasks:
      dlt_gsheets_snowflake:
        integration: PYTHON
        integration_job: PYTHON_EXECUTE_SCRIPT
        parameters:
          package_manager: PIP
          python_version: '3.12'
          build_command: pip install -r requirements.txt
          environment_variables: >-
            {"SHEET_NAME": "${{ MATRIX.gsheets['SHEET_NAME'] }}", "TABLE_NAME":
            "${{ MATRIX.gsheets['TABLE_NAME'] }}", "RANGE_NAME": "dlt_range"}
          set_outputs: false
          source: GIT
          command: python -m run_dlt_pipelines_snowflake
          branch: ${{ inputs.python_branch }}
          project_dir: python/dlt
          shallow_clone_dirs: python/dlt
        depends_on: []
        name: dlt Google Sheets -> Snowflake
        connection: python__production__blueprints__19239
    depends_on: []
    name: Ingest - dlt Google Sheets
    matrix:
      inputs:
        gsheets:
          - SHEET_NAME: 1H0UnZ1vJ6WSsZgiVkg96zq52p7qaXkhvodlO1Mzoj6s
            TABLE_NAME: dbt_leads
          - SHEET_NAME: 1TMNhQFZbmaBsa1vIehQzh3vdyfc05damwJ_PIKDF14A
            TABLE_NAME: social_leads
          - SHEET_NAME: 1tImqLq_zLNthL7DDUkTUjU0xHoV_PhdM1zpuJ-TB0kk
            TABLE_NAME: unstructured_feedback
  ingest_fivetran:
    tasks:
      fivetran_oil_data_sync:
        integration: FIVETRAN
        integration_job: FIVETRAN_SYNC_ALL
        parameters:
          connector_id: ${{ inputs.fivetran_connector_id }}
        depends_on: []
        name: Fivetran Google Sheets (oil_data) -> Snowflake
        connection: h_94547
    depends_on: []
    name: Ingest - Fivetran
  transform_dbt:
    tasks:
      dbt_build_oil_chain:
        integration: DBT_CORE
        integration_job: DBT_CORE_EXECUTE
        parameters:
          commands: >-
            dbt source freshness --select ${{ inputs.dbt_freshness_select }};
            dbt build --select ${{ inputs.dbt_select }}
          package_manager: PIP
          python_version: '3.12'
          use_state_orchestration: false
          branch: ${{ inputs.dbt_branch }}
          project_dir: dbt_projects/snowflake
          shallow_clone_dirs: dbt_projects/snowflake
          warehouse_identifier: JH88529.UK-SOUTH.AZURE
        depends_on: []
        name: dbt build - oil chain subset (no state-aware)
        connection: dbt_snowflake_blueprints_prod_07025
        operation_metadata:
          6a9002ae-26c9-4c08-a6f5-e1e0c2c74bbe:
            integration: SNOWFLAKE
            connection: snowflake__prod__80122
        alerts:
          - name: dbt failures
            statuses:
              - FAILED
            destinations:
              - integration: SLACK
                destination: alert-testing
                connection_id: default_00000
    depends_on:
      - ingest_dlt_python
      - ingest_fivetran
    name: Transform - dbt Core on Snowflake
  consume_power_bi:
    tasks:
      power_bi_refresh:
        integration: POWER_BI
        integration_job: POWER_BI_REFRESH_DATASET
        parameters:
          dataset_id: ${{ inputs.power_bi_dataset_id }}
        depends_on: []
        name: Refresh Power BI dataset
        connection: power_bi__prod__63353
    depends_on:
      - transform_dbt
    name: Consume - Power BI
webhook:
  enabled: false
inputs:
  python_branch:
    type: string
    default: main
  fivetran_connector_id:
    type: string
    default: faithfulness_coal
  dbt_branch:
    type: string
    default: main
  dbt_freshness_select:
    type: string
    default: source:fivetran.oil_data
  dbt_select:
    type: string
    default: +oil_data_aggregated
  power_bi_dataset_id:
    type: string
    default: 5e83dd8a-2c30-44ec-8f53-e5e751ae515d
meta:
  notes: >-
    Ingestion: two parallel lanes - (1) dlt Python scripts load Google Sheets
    into Snowflake (BIGQUERY_SAMPLE.PUBLIC) via a matrix, (2) Fivetran connector
    faithfulness_coal syncs the oil_data Google Sheet into
    FIVETRAN.GOOGLE_SHEETS.OIL_DATA. Transformation: dbt Core on Snowflake
    (dbt_projects/snowflake) runs only the +oil_data_aggregated subset with
    state-aware orchestration OFF to keep Snowflake costs low, after a source
    freshness check on the Fivetran source. dbt_branch defaults to the PR branch
    feat/oil-chain-docs-freshness-dq (orchestra-blueprints PR #296) - switch
    back to main once merged. Consumption: Power BI dataset refresh.
alerts:
  - name: Pipeline failures
    statuses:
      - FAILED
    destinations:
      - integration: SLACK
        destination: alert-testing
        connection_id: default_00000
anomalies:
  - destinations:
      - integration: SLACK
        destination: alert-testing
        connection_id: default_00000
    min_baseline_seconds: 10
    percentage_above_baseline: 20
    type: pipeline_duration_above_baseline
