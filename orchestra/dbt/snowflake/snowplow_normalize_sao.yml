version: v1
name: Efficient Snowplow Event Processing with Orchestra and dbt
pipeline:
  e2867f57-90d5-4e8a-a2fa-b0ae504d50f2:
    tasks:
      dddc7650-8669-415d-8ac3-fd10119d68ff:
        integration: DBT_CORE
        integration_job: DBT_CORE_EXECUTE
        parameters:
          commands: dbt build
          package_manager: PIP
          python_version: '3.12'
          use_state_orchestration: true
          project_dir: dbt_projects/snowplow_snowflake_sao
          shallow_clone_dirs: dbt_projects/snowplow_snowflake_sao
        depends_on: []
        name: dbt Build
        connection: dbt_snowflake_blueprints_prod_07025
    depends_on: []
    name: ''
  42ca818d-f9e4-44cd-8c69-150c850e3af0:
    tasks:
      ec8b313f-6b34-4667-9663-b9c411553e7e:
        integration: LIGHTDASH
        integration_job: LIGHTDASH_REFRESH_DASHBOARD
        parameters:
          dashboard_id: snowplow-event-summary
          invalidate_cache: true
        depends_on: []
        name: Refresh Lightdash Dashboard
        connection: lightdash__snowplow__79073
    depends_on:
    - e2867f57-90d5-4e8a-a2fa-b0ae504d50f2
    name: refresh dashboard
  375c6e84-1068-4d7b-90ed-67e478305d0e:
    tasks:
      c1e9841e-352a-47ef-b8ae-9f612a4ce3c4:
        integration: SNOWFLAKE
        integration_job: SNOWFLAKE_RUN_QUERY
        parameters:
          statement: >-
            select distinct e.event_name
            from SNOWPLOW_TRACKING.ATOMIC.EVENTS e
            where e.collector_tstamp >= dateadd(day, -7, current_timestamp())
              and e.event_name not in (
                select distinct event_name
                from SNOWFLAKE_WORKING.PUBLIC.SNOWPLOW_EVENTS_NORMALIZED
              )
            order by 1
          set_outputs: true
        depends_on: []
        name: Find unmodelled event names
        # MANUAL: this role needs SELECT on SNOWPLOW_TRACKING.ATOMIC.EVENTS.
        # LIGHTDASH_ROLE cannot read that schema; the dbt Core connection's
        # role can, so match that one if the default fails.
        connection: snowflake__prod__80122
    depends_on:
    - e2867f57-90d5-4e8a-a2fa-b0ae504d50f2
    name: find unmodelled events
  5391fff7-6099-4727-b08a-3b492cbc8719:
    tasks:
      e0561460-71e4-4806-96a9-26f5bb4eab9d:
        integration: ORCHESTRA
        integration_job: RUN_AGENT
        parameters:
          # MANUAL: an agent with Git access and a PAT carrying pull-request
          # scope in its secrets. The workspace Git connection cannot open PRs.
          agent_id: REPLACE_WITH_AGENT_ID
          prompt: >-
            These Snowplow event names are present in
            SNOWPLOW_TRACKING.ATOMIC.EVENTS but no normalized dbt model covers
            them, so they never reach the dashboard:

            ${{ ORCHESTRA.PIPELINE_RUN_TASKS['c1e9841e-352a-47ef-b8ae-9f612a4ce3c4'].OUTPUTS['results']
            }}

            Work in dbt_projects/snowplow_snowflake_sao. For each event name,
            decide how it should be modelled and add an entry to
            normalize_config.json:

            - Check whether an UNSTRUCT_EVENT_* column for it exists on
              SNOWPLOW_TRACKING.ATOMIC.EVENTS. If one does, and the schema
              resolves against Iglu Central, add it under
              self_describing_event_schemas with a short alias so its fields
              are flattened.
            - If no such column exists, or the schema is not in Iglu Central,
              add the event with event_columns only. resolver_file_path is
              "default", which reaches Iglu Central and nothing else, so a
              custom vendor will not resolve - do not invent one.
            - Only use flat columns that actually exist on the events table.

            Then regenerate and open a PR against main:

            1. python dbt_packages/snowplow_normalize/utils/snowplow_normalize_model_gen.py normalize_config.json
            2. python scripts/gen_schema_yml.py
            3. Open a PR explaining, per event, how you chose to model it and
               why.

            Step 2 is not optional. The generator emits only .sql; without a
            regenerated schema.yml, Lightdash builds no explores for the new
            models and types every column as a string.

            If an event looks like noise or a one-off rather than something
            worth modelling, say so in the PR description rather than adding
            it silently.
        depends_on: []
        name: Propose models for new events
    depends_on:
    - 375c6e84-1068-4d7b-90ed-67e478305d0e
    # Only when the query actually returned unmodelled events.
    condition: tasks['c1e9841e-352a-47ef-b8ae-9f612a4ce3c4'].status == 'SUCCEEDED'
      and len(tasks['c1e9841e-352a-47ef-b8ae-9f612a4ce3c4'].outputs['results']) > 0
    name: propose new event models
schedule:
- name: Daily build
  cron: 0 6 * * ? *
  timezone: UTC
  run_inputs:
    trigger_name: daily
webhook:
  enabled: false
inputs:
  trigger_name:
    type: string
    default: daily
    options:
    - daily
    - weekly
