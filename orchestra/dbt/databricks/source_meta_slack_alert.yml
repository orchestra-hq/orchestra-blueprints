version: v1
name: 'dbt Databricks - source meta Slack alert test #dbt #databricks #slack #testing'
pipeline:
  group:
    name: group
    depends_on: []
    tasks:
      freshness:
        integration: DBT_CORE
        integration_job: DBT_CORE_EXECUTE
        name: dbt source freshness
        depends_on: []
        # Swap for a dbt Core (Databricks) connection bound to orchestra-blueprints in your workspace
        connection: dbt_databricks_demo_54814
        parameters:
          commands: dbt --warn-error source freshness --select tag:tier_1 --vars '{"source_database": "${{ inputs.source_database }}"}'
          branch: claude/dbt-databricks-source-slack-alert
          package_manager: PIP
          python_version: '3.12'
          use_state_orchestration: false
          project_dir: dbt_projects/databricks
          shallow_clone_dirs: dbt_projects/databricks
        alerts:
          - name: dbt failures
            statuses:
              - FAILED
              - WARNING
            destinations:
              - integration: SLACK
                destination: alert-testing
                # Swap for your workspace's Slack connection
                connection_id: default_00000
inputs:
  source_database:
    type: string
    default: hive_metastore
webhook:
  enabled: false
