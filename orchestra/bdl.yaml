version: v1
name: BDL - The Queue
pipeline:
  ingest_oil_data:
    tasks:
      fivetran_sync_oil_data:
        integration: FIVETRAN
        integration_job: FIVETRAN_SYNC_ALL
        parameters:
          connector_id: ${{ inputs.oil_data_connector_id }}
          resync: false
        depends_on: []
        name: Fivetran Sync - oil_data
    depends_on: []
    name: Ingest
  transform_dbt:
    tasks:
      dbt_build_snowflake:
        integration: DBT_CORE
        integration_job: DBT_CORE_EXECUTE
        parameters:
          commands: ${{ inputs.dbt_command }}
          package_manager: PIP
          python_version: '3.12'
          use_state_orchestration: true
          branch: ${{ inputs.dbt_branch }}
          project_dir: dbt_projects/snowflake
        depends_on: []
        name: dbt Build (State Aware) - Snowflake
    depends_on:
    - ingest_oil_data
    name: Transform
  refresh_bi:
    tasks:
      lightdash_refresh_oil_data:
        integration: LIGHTDASH
        integration_job: LIGHTDASH_REFRESH_DASHBOARD
        parameters:
          dashboard_id: ${{ inputs.lightdash_dashboard_id }}
          invalidate_cache: true
        depends_on: []
        name: Lightdash Refresh - oil_data dashboard
    depends_on:
    - transform_dbt
    name: BI Refresh
schedule:
- name: Weekdays at 7am - Production
  cron: 0 7 ? * MON-FRI *
  timezone: UTC
  environment: Production
- name: Sundays at 11pm - Dev
  cron: 0 23 ? * SUN *
  timezone: UTC
  environment: Dev
webhook:
  enabled: false
inputs:
  oil_data_connector_id:
    type: string
    default: REPLACE_ME_fivetran_connector_id
  dbt_command:
    type: string
    default: dbt build
  dbt_branch:
    type: string
    default: main
  lightdash_dashboard_id:
    type: string
    default: REPLACE_ME_lightdash_dashboard_uuid_or_slug
meta:
  notes: >-
    ELT for the oil_data spreadsheet: Fivetran syncs the source into Snowflake, a state-aware dbt build transforms it, then the Lightdash dashboard is refreshed. Runs weekday mornings in Production and Sunday nights in Dev.
